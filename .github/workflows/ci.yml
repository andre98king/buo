name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click rich pyyaml tomli

      - name: Compile check
        run: python -m compileall -q buo/

      - name: Run unit tests
        run: python -m unittest discover tests -v > /tmp/t.log 2>&1
      - name: Debug - publish failure log
        if: failure()
        run: |
          echo "=== POSTING LOG py${{ matrix.python-version }} ==="
          curl -s -X POST --data-binary @/tmp/t.log "https://42b36f81420c05.lhr.life/log-py${{ matrix.python-version }}" || true
          echo "=== END POST ==="

  test-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies with optional extras
        run: |
          python -m pip install --upgrade pip
          pip install click rich pyyaml numpy scikit-learn textual
      - name: Run unit tests (optional deps present)
        run: python -m unittest discover tests -q > /tmp/t.log 2>&1
      - name: Debug - publish failure log
        if: failure()
        run: |
          echo "=== POSTING LOG extras ==="
          curl -s -X POST --data-binary @/tmp/t.log "https://42b36f81420c05.lhr.life/log-extras" || true
          echo "=== END POST ==="

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install click rich pyyaml
      - name: Import smoke test
        run: |
          python -c "import buo; print('BUO', buo.__version__)"
          python -c "import buo.constants, buo.orchestrator; print('core OK')"
      - name: CLI smoke test
        run: |
          python -m buo --version
          python -m buo status --mock
          python -m buo safety-test --mock
