name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click rich pyyaml

      - name: Compile check
        run: python -m compileall -q buo/

      - name: Run unit tests
        run: python -m unittest discover tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install click rich pyyaml
      - name: Import smoke test
        run: |
          python -c "import buo; print('BUO', buo.__version__)"
          python -c "import buo.constants, buo.orchestrator; print('core OK')"
      - name: CLI smoke test
        run: |
          python -m buo --version
          python -m buo status --mock
          python -m buo safety-test --mock
