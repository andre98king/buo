# BUO — configurazione default (personalizzabile dall'utente)
# Gli HARD LIMITS (vid_absolute_max, gpu_voltage_absolute_max...) NON
# sono sovrascrivibili: vivono in buo/constants.py e sono immutabili.
version: "1.0"

hardware:
  psu_wattage: 350            # W — alimentatore dichiarato
  cooling_type: "push-pull"   # passive | push-pull | custom

safety:
  cpu_vid_recommended_max: 1300   # mV (hard limit immutabile: 1325)
  # Politica termica a due livelli (03/09): cpu_temp_max/gpu_temp_max
  # sono i limiti HARD dell'abort real-time (SafetyMonitor/stress).
  # Il TARGET OPERATIVO applicato resta nel governor (throttle 85/75)
  # e nel max_temperature del conf SMU (90) — NON è un criterio di
  # validazione/sweep: una config che in stress sintetico fa 86-92 °C
  # (in game ~71-75 °C) NON viene più bocciata.
  cpu_temp_max: 95                # °C — HARD abort real-time
  cpu_freq_max: 4000              # MHz
  gpu_voltage_recommended_max: 1050  # mV (hard limit immutabile: 1100)
  gpu_temp_max: 105               # °C — HARD abort real-time
  gpu_freq_max: 2200              # MHz
  power_budget: 300               # W (margine per PSU 350W)

vram_estimation:
  enabled: true
  alpha: 0.45                # accoppiamento termico GPU→VRAM
  beta: 0.04                 # °C per watt GPU
  tau: 5.0                   # costante di tempo smoothing (s)
  warning_threshold: 82      # °C
  critical_threshold: 92     # °C

phases:
  probe:
    cpu_unlock: true
    gpu_unlock: true
    # health_test: true = "smart": riusa i results.tsv completi; skip
    # con ricetta se assenti/incompleti (mai la maratona per-WGP da una
    # run non presidiata — design portabilità)
    health_test: true
    health_reboot_max: 25
    # Validazione post-unlock (design POSTUNLOCK_VALIDATION): interruttore
    # master della nuova fase unlock_validate (CPU post-reboot) e della
    # validazione short GPU dopo enable_all / 40-CU attive non certificate
    unlock_validate: true
  fix:
    tlb: true                # patch kernel TLB fault (AI/ML)
    ace: true                # fix compute queue (kernel+Mesa)
    iommu: true              # verifica IOMMU attivo (no-op: MAI iommu=off)
    acpi: true               # SSDT C-State
    vram: true               # bc250_memcfg (split VRAM)
    gtt: true                # ttm.pages_limit
    fan: true                # sensori/ventole NCT6686
  undervolt:
    # cpu_target_vid: auto = derivato dalla misura live del VID stock
    # (clamp misura−75 su [900, 1250] + ladder + fallback no-UV);
    # un numero esplicito (es. 1000) vince e mantiene il comportamento
    # odierno (ricerca con target fisso)
    cpu_target_vid: auto
    cpu_search_freq: 3500    # MHz — frequenza della ricerca UV (stock)
    gpu_start_freq: 1200     # MHz
  overclock:
    enable: true
    power_budget: 300        # W
  validation:
    stress_duration: 10      # minuti (10 = soglia L2 del motore OC)
    # Validazione post-unlock (design POSTUNLOCK_VALIDATION): durate
    # della verifica SHORT delle unità extra. 0 = skip esplicito;
    # clamp [10, 300] secondi.
    unlock_cpu_seconds: 60   # s — 4× stress-ng --verify sui thread 12-15
    unlock_gpu_seconds: 60   # s — vkmark sulle 40 CU (display + radv)

benchmark:
  enabled: true
  gpu_duration: 60           # s (furmark/glmark2)
  cpu_duration: 60           # s (stress-ng)
  compute_duration: 30       # s (vkmark)

deps:
  auto_install: true         # BUO scarica da solo i tool mancanti al primo avvio
  auto_install_governor: true   # il governor viene auto-installato (COPR/AUR ufficiale) di default

# ostree: deployment-aware reboot (run da deployment NON-default)
#   auto_swap_default: true   # swap del default di boot sui run da deployment non-default




